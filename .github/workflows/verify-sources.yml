name: verify-sources
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: |
          python3 data/verify_sources.py > report.txt || echo "drift=1" >> "$GITHUB_OUTPUT"
          cat report.txt
      - if: steps.v.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Source drift $(date -u +%F)" --label data --body-file report.txt
